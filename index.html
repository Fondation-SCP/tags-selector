<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF8">
        <title>tags-selector</title>

        <link rel="icon" type="image/gif" href="https://fondationscp.wikidot.com/local--favicon/favicon.gif">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="header">
            <div id="title">
                <div id="refresh" title="Rafraîchir la page">
                    <img class="scp-logo" src="resources/scp-logo.svg" alt="">
                    <h1>tags-selector</h1>
                </div>
                <span id="ontology-source" class="hidden"></span>
            </div>

            <div id="search">
                <input id="search-input" type="text" placeholder="Rechercher un tag..." autocomplete="off" spellcheck="false">
                <ul id="search-results" class="hidden"></ul>
            </div>
        </div>

        <div id="loading-overlay">
            <div id="loading-box">
                <img id="loading-spinner" src="resources/scp-logo.svg" alt="">
                <p id="loading-text">Chargement de l'ontologie...</p>
            </div>
        </div>

        <!-- Graphe -->
        <div id="cy"></div>

        <div id="tag-info" class="hidden">
            <h3 id="tag-info-name"></h3>
            <p id="tag-info-parents"></p>
            <p id="tag-info-comment"></p>
        </div>

        <div id="selected-tags" class="hidden">
            <h3 id="selected-tags-title">Aucun tag sélectionné</h3>
            <div id="selected-tags-list"></div>
            <div id="selected-tags-actions">
                <button id="selected-tags-copy" title="Copier les tags au format Wikidot (séparés par des espaces)">Copier</button>
                <button id="selected-tags-reset" title="Désélectionner tous les tags sans replier le graphe">Tout désélectionner</button>
            </div>
        </div>

        <div id="popup-overlay" class="hidden">
            <div id="popup-box">
                <div id="popup-header">
                    <img class="scp-logo" src="resources/scp-logo.svg" alt="">
                    <h3 id="popup-title"></h3>
                </div>
                <p id="popup-text"></p>
                <div id="popup-buttons">
                    <button id="popup-cancel" class="hidden">Annuler</button>
                    <button id="popup-ok">OK</button>
                </div>
            </div>
        </div>

        <div id="graph-controls">
            <button id="history-undo" class="graph-button" title="Annuler (Ctrl+Z)" disabled>↶</button>
            <button id="history-redo" class="graph-button" title="Rétablir (Ctrl+Y)" disabled>↷</button>
            <button id="rdf-open" class="graph-button" title="Remplacer l'ontologie par un fichier local, sans le publier">Charger un .rdf</button>
            <button id="graph-expand" class="graph-button">Tout déployer</button>
            <button id="graph-collapse" class="graph-button">Tout replier</button>
        </div>

        <input id="rdf-input" type="file" accept=".rdf,.owl,.xml" hidden>

        <!-- Comunica -->
        <script src="https://rdf.js.org/comunica-browser/versions/v4/engines/query-sparql/comunica-browser.js"></script>

        <!-- Cytoscape.js -->
        <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.33.1/dist/cytoscape.min.js"></script>

        <script src="src/fallback.js"></script>
        <script type="module" src="src/main.js" onerror="failScripts()"></script>
    </body>
</html>
